version: "3.3"
services:
  db:
    image: mariadb:10.4
    container_name: db_docker_technodex
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db:/var/db
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    networks:
      - dev
    ports:
      - "3310:3306"
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_docker_technodex
    depends_on:
      - db
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 100M
    networks:
      - dev

  maildev:
    image: maildev/maildev
    container_name: maildev_docker_technodex
    command: bin/maildev --web 80 --smtp 25 --hide-extensions STARTTLS
    ports:
      - "8082:80"
      - "1026:25"
    networks:
      - dev

  www:
    build: ./docker/php
    container_name: www_docker_technodex
    ports:
      - "8080:80"
    volumes:
      - ./docker/php/vhosts:/etc/apache2/sites-enabled
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./:/var/www
      - ./tmp:/tmp
    networks:
      - dev
  redis:
    image: redis:6-alpine
    networks:
      - dev
    sysctls:
      - "net.core.somaxconn=511"
    ports:
      - 6380:6379

networks:
  dev:

volumes:
  db-data:
